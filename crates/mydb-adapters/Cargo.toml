[package]
name = "mydb-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Exposes constructors that bypass a live database, for tests in other crates.
# The application never enables this, so no shipped build can reach them.
test-support = []

[dependencies]
mydb-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tokio-postgres = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"

[lints]
workspace = true
