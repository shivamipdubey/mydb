# Cross-platform build and test matrix.
#
# MYDB is developed on macOS only, so this matrix is how Windows and Linux
# breakage is caught per commit instead of accumulating until phase 3
# (docs/03-phases-roadmap.md). All runners are standard GitHub-hosted.
#
# Actions are pinned to commit SHAs rather than tags: a tag is mutable, so a
# compromised upstream tag could otherwise alter our build silently
# (docs/16-security-and-cybersafety-checklist.md, item 6).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Tauri needs the system WebView and its build dependencies on Linux.
      # macOS and Windows ship theirs with the OS.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: npm ci

      # The Rust build embeds the built frontend at compile time, so the
      # frontend must be built before anything Rust is compiled.
      - name: Build frontend
        run: npm run vite:build

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build Rust workspace
        run: cargo build --workspace --locked

      - name: Test Rust workspace
        run: cargo test --workspace --locked

  # Integration tests need a real Postgres. GitHub-hosted macOS runners have no
  # Docker daemon and Windows runners only run Windows containers, so service
  # containers are Linux-only. Adapter integration coverage therefore runs here
  # alone; docs/18-testing-strategy.md records this limitation.
  integration:
    name: integration (postgres, ubuntu)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same digest-pinned image as docker-compose.yml, so CI and local
        # development test against byte-identical Postgres.
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: mydb_test
          POSTGRES_PASSWORD: mydb_test_password
          POSTGRES_DB: mydb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mydb_test -d mydb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # A service container publishes on the standard port; local development
      # uses a non-default one to avoid colliding with a real Postgres.
      MYDB_TEST_PG_PORT: '5432'
      MYDB_TEST_DATABASE_URL: host=localhost port=5432 user=mydb_test password=mydb_test_password dbname=mydb_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: '. -> target'

      # A service container runs the image's entrypoint but cannot mount our
      # seed file, so the seed is applied here instead of via initdb.
      - name: Seed the database
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=mydb_test_password psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U mydb_test -d mydb_test -f testing/seed.sql

      # Integration tests are #[ignore]d so `cargo test` works without Docker.
      # This job runs them explicitly, and fails if none actually ran, so a
      # suite that quietly stops executing cannot look like a pass.
      #
      # mydb-app is excluded: it is the Tauri desktop shell, whose GTK system
      # libraries are irrelevant to database integration testing and cost
      # several minutes to install. The shell is built and tested in full by
      # the build-and-test job on all three platforms.
      - name: Run integration tests
        run: |
          set -o pipefail
          cargo test --workspace --exclude mydb-app --locked -- --ignored 2>&1 | tee integration.log
          if ! grep -qE "test result: ok\. [1-9][0-9]* passed" integration.log; then
            echo "::error::No integration tests actually ran"
            exit 1
          fi

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # A reported vulnerability is blocking. Unmaintained and unsound
      # advisories on transitive dependencies we do not choose directly are
      # recorded, not blocking (docs/16, item 6).
      - name: Audit Rust dependencies
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2025-0081 --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080 --ignore RUSTSEC-2025-0100 --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2024-0429

      - name: Audit npm dependencies
        run: npm ci && npm audit --audit-level=moderate
